<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CheckMate - Fire Edition</title>
    
    <!-- Librerías Core -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    
    <!-- Configuración Tailwind (Tema Fuego) -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        zinc: { 850: '#1f1f22', 900: '#18181b', 950: '#0c0c0e' }, 
                        fire: { 
                            400: '#fb923c', 500: '#f97316', 600: '#ea580c', 700: '#c2410c', 800: '#9a3412', 
                        }
                    },
                    spacing: {
                        'safe-top': 'env(safe-area-inset-top)',
                        'safe-bottom': 'env(safe-area-inset-bottom)',
                        'safe-left': 'env(safe-area-inset-left)',
                        'safe-right': 'env(safe-area-inset-right)',
                    },
                    screens: { 'print': {'raw': 'print'} }
                }
            }
        }
    </script>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background-color: #000; 
            color: #fff;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none;
        }
        
        /* Ajuste de márgenes seguros para móviles */
        .safe-padding {
            padding-left: max(16px, env(safe-area-inset-left));
            padding-right: max(16px, env(safe-area-inset-right));
            padding-bottom: max(16px, env(safe-area-inset-bottom));
        }
        
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #0c0c0e; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #f97316; }

        .fire-checkbox {
            appearance: none; width: 1.4em; height: 1.4em;
            border: 2px solid #52525b; border-radius: 0.35em;
            display: grid; place-content: center; cursor: pointer; transition: all 0.1s ease;
        }
        .fire-checkbox:checked { border-color: #f97316; background-color: #f97316; }
        .fire-checkbox:disabled { opacity: 0.5; border-color: #333; background-color: #111; }
        .fire-checkbox::before {
            content: "✓"; color: white; font-size: 0.9em; font-weight: bold;
            transform: scale(0); transition: transform 0.1s;
        }
        .fire-checkbox:checked::before { transform: scale(1); }

        .bg-gradient-fire { background: linear-gradient(135deg, #f97316 0%, #dc2626 100%); }

        .pie-chart {
            width: 120px; height: 120px; border-radius: 50%;
            background: conic-gradient(var(--color) var(--percent), #333 0);
            display: flex; align-items: center; justify-content: center;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .pie-chart::after {
            content: ""; position: absolute; width: 85%; height: 85%;
            background: #18181b; border-radius: 50%;
        }
        .pie-content { position: absolute; z-index: 10; text-align: center; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .animate-slide-up { animation: slideUp 0.3s ease-out forwards; }

        @media print {
            @page { size: portrait; margin: 1cm; }
            body { background-color: white !important; color: black !important; font-size: 10pt; }
            .no-print, aside, button, .add-form, .fab-btn, .mobile-header, .login-screen, .new-list-modal, .focus-mode { display: none !important; }
            main { margin: 0 !important; width: 100% !important; padding: 0 !important; height: auto !important; overflow: visible !important; }
            .card { border: 1px solid #000 !important; break-inside: avoid; margin-bottom: 20px; box-shadow: none !important; background: white !important; }
            .card-header { border-bottom: 1px solid #000 !important; background: #eee !important; color: black !important; }
            .checkbox-label { color: black !important; }
            .fire-checkbox { border-color: #000 !important; }
            .fire-checkbox:checked { background-color: #000 !important; }
            .progress-fill { background-color: #000 !important; }
            .user-tag { border: 1px solid #000 !important; color: #000 !important; }
            .stats-view { display: block !important; } 
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden bg-black text-white">
    <div id="root" class="h-full w-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        const CHECKLIST_ROOM_ID = "checkmate-global-v11-location";

        const FIREBASE_CONFIG = {
            apiKey: "AIzaSyAUiRqoUjkVQdfpN2IVGUAHjd8SIWi8J6Q",
            authDomain: "cronogramastack.firebaseapp.com",
            projectId: "cronogramastack",
            storageBucket: "cronogramastack.firebasestorage.app",
            messagingSenderId: "1077254109806",
            appId: "1:1077254109806:web:ca59b3a41aa22aacb2447f"
        };

        let db = null;
        let auth = null;
        let isFirebaseAvailable = false;

        try {
            if (FIREBASE_CONFIG.apiKey && typeof firebase !== 'undefined') {
                if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
                db = firebase.firestore();
                auth = firebase.auth();
                isFirebaseAvailable = true;
            }
        } catch (e) { console.log("Modo Offline Activo"); }

        const Icons = {
            Plus: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M12 4v16m8-8H4"/></svg>,
            Trash: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>,
            Edit: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/></svg>,
            Menu: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>,
            Cloud: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z"/></svg>,
            Printer: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/></svg>,
            Check: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="3" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7"/></svg>,
            User: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>,
            Building: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>,
            Logout: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>,
            Desktop: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>,
            Chart: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M11 3.055A9.001 9.001 0 1020.945 13H11V3.055z"/><path strokeLinecap="round" strokeLinejoin="round" d="M20.488 9H15V3.512A9.025 9.025 0 0120.488 9z"/></svg>,
            List: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/></svg>,
            Close: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>,
            Back: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
        };

        const generateId = () => Math.random().toString(36).substr(2, 9);

        // --- PANTALLA DE LOGIN ---
        const LoginScreen = ({ onLogin }) => {
            const [name, setName] = useState('');

            const handleSubmit = (e) => {
                e.preventDefault();
                if (name) {
                    const lowerName = name.trim().toLowerCase();
                    const supervisors = ['carlos', 'jorge', 'carlos urbina', 'jorge garcia', 'leonardo', 'leo'];
                    const isAdmin = supervisors.includes(lowerName);
                    
                    onLogin({ name: name.trim(), isAdmin });
                }
            };

            return (
                <div className="fixed inset-0 bg-black flex items-center justify-center z-50 p-6 login-screen">
                    <div className="bg-zinc-900 border border-zinc-800 p-8 rounded-2xl w-full max-w-sm shadow-2xl shadow-fire-900/20 animate-fade-in">
                        <div className="text-center mb-8">
                            <div className="w-16 h-16 bg-gradient-fire rounded-xl flex items-center justify-center text-white text-3xl mb-4 mx-auto shadow-lg shadow-fire-500/30">
                                <Icons.Check />
                            </div>
                            <h2 className="text-2xl font-bold text-white">Check<span className="text-fire-500">Mate</span></h2>
                            <p className="text-zinc-400 text-sm mt-2">Plataforma Técnica</p>
                        </div>
                        <form onSubmit={handleSubmit} className="space-y-6">
                            <div>
                                <label className="block text-xs font-bold text-zinc-500 uppercase mb-2">Nombre del Técnico</label>
                                <div className="relative">
                                    <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-zinc-500"><Icons.User /></div>
                                    <input 
                                        type="text" required autoFocus
                                        className="w-full bg-black border border-zinc-700 rounded-lg py-3 pl-10 pr-3 text-white focus:border-fire-500 outline-none transition-colors"
                                        placeholder="Ej: Juan Pérez..."
                                        value={name} onChange={e => setName(e.target.value)}
                                    />
                                </div>
                            </div>
                            <button type="submit" className="w-full bg-gradient-fire text-white font-bold py-3.5 rounded-lg shadow-lg hover:opacity-90 transition-opacity">
                                INGRESAR
                            </button>
                        </form>
                    </div>
                </div>
            );
        };

        // --- PANTALLA DE EDICIÓN ENFOCADA (FOCUS MODE) ---
        const FocusListEditor = ({ list, onSave, onFinish }) => {
            const [localList, setLocalList] = useState(list);
            const inputRef = useRef(null);

            useEffect(() => {
                const timeoutId = setTimeout(() => { onSave(localList); }, 500);
                return () => clearTimeout(timeoutId);
            }, [localList, onSave]);

            const updateMachineName = (val) => setLocalList({ ...localList, title: val }); // Título es nombre PC
            const toggleItem = (itemId) => setLocalList({ ...localList, items: localList.items.map(i => i.id === itemId ? { ...i, done: !i.done } : i) });
            const deleteItem = (itemId) => setLocalList({ ...localList, items: localList.items.filter(i => i.id !== itemId) });
            const updateObs = (val) => setLocalList({ ...localList, observations: val });

            const completed = localList.items.filter(i => i.done).length;
            const total = localList.items.length;
            const percent = total === 0 ? 0 : Math.round((completed / total) * 100);

            return (
                <div className="fixed inset-0 bg-zinc-950 z-50 flex flex-col focus-mode animate-slide-up pt-safe">
                    <div className="bg-zinc-900 border-b border-zinc-800 p-4 flex items-center justify-between shrink-0">
                        <button onClick={() => onFinish(false)} className="text-zinc-400 hover:text-white p-2"><Icons.Back /></button>
                        <div className="text-center flex-1 mx-2 overflow-hidden">
                            <h2 className="font-bold text-white truncate text-base">{localList.title}</h2>
                            <p className="text-[10px] text-zinc-400 truncate">{localList.owner}</p>
                        </div>
                        <div className="text-fire-500 font-bold font-mono text-sm">{percent}%</div>
                    </div>

                    <div className="flex-1 overflow-y-auto p-4 space-y-4 pb-24">
                         {/* Campo Nombre de PC en Edición */}
                         <div className="bg-zinc-900 border border-zinc-800 rounded-xl p-3 flex items-center gap-3">
                            <Icons.Desktop className="text-fire-500 w-5 h-5" />
                            <div className="flex-1">
                                <label className="block text-[10px] font-bold text-zinc-500 uppercase mb-1">Nombre de la PC / Equipo</label>
                                <input 
                                    type="text" 
                                    className="w-full bg-transparent text-white focus:outline-none font-bold text-base"
                                    value={localList.title}
                                    onChange={(e) => updateMachineName(e.target.value)}
                                />
                            </div>
                        </div>

                        <div className="space-y-2">
                            {localList.items.map(item => (
                                <div key={item.id} className="flex items-start gap-3 bg-zinc-900 p-3 rounded-lg border border-zinc-800">
                                    <input type="checkbox" className="fire-checkbox flex-shrink-0 mt-0.5" checked={item.done} onChange={() => toggleItem(item.id)} />
                                    <span className={`flex-1 text-sm ${item.done ? 'text-zinc-500 line-through' : 'text-zinc-200'}`}>{item.text}</span>
                                    <button onClick={() => deleteItem(item.id)} className="text-zinc-600 hover:text-red-500 p-2"><Icons.Trash /></button>
                                </div>
                            ))}
                        </div>

                        <div className="mt-4">
                            <label className="text-xs font-bold text-zinc-500 uppercase">Observaciones</label>
                            <textarea className="w-full bg-zinc-900 border border-zinc-800 rounded-lg p-3 text-sm text-white mt-1 h-32 focus:border-fire-500 outline-none" placeholder="Notas adicionales..." value={localList.observations || ''} onChange={(e) => updateObs(e.target.value)} />
                        </div>
                    </div>

                    <div className="absolute bottom-0 left-0 right-0 p-4 border-t border-zinc-800 bg-zinc-900 shrink-0 pb-safe">
                        <button onClick={() => onFinish(true)} className="w-full bg-gradient-fire text-white font-bold py-3.5 rounded-xl shadow-lg shadow-fire-900/20 active:scale-95 transition-transform flex items-center justify-center gap-2">
                            <Icons.Check /> Finalizar y Archivar
                        </button>
                    </div>
                </div>
            );
        };

        // --- VISTA DE ESTADÍSTICAS ---
        const StatsView = ({ lists, onOpenList, onDeleteList, currentUser }) => {
            const [totalTarget, setTotalTarget] = useState(() => {
                return localStorage.getItem('checkmate_target_computers') || 270;
            });

            const handleTargetChange = (e) => {
                const val = e.target.value;
                setTotalTarget(val);
                localStorage.setItem('checkmate_target_computers', val);
            };

            const completedLists = lists.filter(l => l.status === 'completed');
            
            const computersDone = completedLists.length;
            const coveragePercent = totalTarget > 0 ? Math.min(100, Math.round((computersDone / totalTarget) * 100)) : 0;
            
            const techStats = {};
            lists.forEach(l => {
                const tech = l.createdBy || 'Anon';
                if (!techStats[tech]) techStats[tech] = { total: 0, done: 0, lists: 0 };
                techStats[tech].lists++;
                techStats[tech].total += l.items.length;
                techStats[tech].done += l.items.filter(i => i.done).length;
            });

            const coverageColor = coveragePercent < 50 ? '#ef4444' : coveragePercent < 80 ? '#f97316' : '#22c55e';

            return (
                <div className="p-4 pb-28 space-y-6 animate-fade-in stats-view safe-padding">
                    <h2 className="text-xl font-bold text-white flex items-center gap-2"><Icons.Chart /> Estadísticas Globales</h2>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div className="bg-zinc-900 border border-zinc-800 p-5 rounded-2xl flex items-center justify-between shadow-lg">
                            <div>
                                <p className="text-zinc-500 text-xs font-bold uppercase mb-1">Cobertura</p>
                                <h3 className="text-3xl font-bold text-white mt-1">{coveragePercent}%</h3>
                                <div className="mt-2 flex items-center gap-2 text-xs text-zinc-400">
                                    <span className="text-white font-bold">{computersDone}</span> de 
                                    <input 
                                        type="number" 
                                        className="bg-zinc-800 border border-zinc-700 rounded w-10 text-center text-white px-1 py-0.5 mx-1 focus:border-fire-500 outline-none"
                                        value={totalTarget}
                                        onChange={handleTargetChange}
                                    />
                                    equipos
                                </div>
                            </div>
                            <div className="pie-chart scale-90" style={{"--percent": `${coveragePercent}%`, "--color": coverageColor}}>
                                <div className="pie-content text-lg font-bold">{coveragePercent}%</div>
                            </div>
                        </div>

                        <div className="bg-zinc-900 border border-zinc-800 p-5 rounded-2xl flex flex-col justify-center shadow-lg">
                            <p className="text-zinc-500 text-xs font-bold uppercase mb-2">Equipos Verificados</p>
                            <h3 className="text-4xl font-bold text-white">{computersDone}</h3>
                            <p className="text-emerald-500 text-xs mt-2 font-medium">Mantenimiento Completado</p>
                        </div>
                    </div>

                    <div className="bg-zinc-900 border border-zinc-800 rounded-2xl overflow-hidden shadow-lg">
                        <div className="p-4 border-b border-zinc-800 bg-zinc-900/50">
                            <h3 className="font-bold text-xs text-zinc-300 uppercase">Rendimiento por Técnico</h3>
                        </div>
                        <div className="divide-y divide-zinc-800">
                            {Object.entries(techStats).sort((a,b) => b[1].done - a[1].done).map(([name, stats], idx) => (
                                <div key={name} className="p-3 flex items-center justify-between">
                                    <div className="flex items-center gap-3">
                                        <div className={`w-6 h-6 rounded flex items-center justify-center text-xs font-bold ${idx === 0 ? 'bg-yellow-500 text-black' : 'bg-zinc-800 text-zinc-400'}`}>
                                            {idx + 1}
                                        </div>
                                        <div>
                                            <p className="font-medium text-white text-sm">{name}</p>
                                            <p className="text-[10px] text-zinc-500">{stats.lists} equipos</p>
                                        </div>
                                    </div>
                                    <div className="text-right">
                                        <p className="text-fire-500 font-bold text-sm">{Math.round((stats.done/stats.total || 0)*100)}%</p>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>

                    <div className="space-y-3">
                        <h3 className="font-bold text-xs text-zinc-500 uppercase pl-1">Historial (Toque para Editar)</h3>
                        
                        {completedLists.length === 0 && <p className="text-zinc-600 text-sm italic py-4 text-center">No hay equipos verificados aún.</p>}
                        
                        {Object.entries(completedLists.reduce((groups, list) => {
                            const key = list.floor ? list.floor.toUpperCase() : 'SIN UBICACIÓN';
                            if (!groups[key]) groups[key] = [];
                            groups[key].push(list);
                            return groups;
                        }, {})).sort().map(([floorName, floorLists]) => (
                            <div key={floorName} className="mb-4">
                                <h4 className="text-fire-500 text-[10px] font-bold uppercase mb-2 pl-1 border-b border-zinc-800 pb-1 flex items-center gap-2">
                                    <Icons.Building className="w-3 h-3"/> {floorName} <span className="bg-zinc-800 text-zinc-400 px-1.5 rounded-full text-[10px]">{floorLists.length}</span>
                                </h4>
                                <div className="space-y-3">
                                    {floorLists.map(l => {
                                         const p = l.items.length > 0 ? Math.round((l.items.filter(i=>i.done).length / l.items.length) * 100) : 0;
                                         return (
                                             <div key={l.id} onClick={() => onOpenList(l.id)} className="bg-zinc-900 border border-zinc-800 p-3 rounded-xl cursor-pointer hover:border-fire-500/50 transition-colors relative group">
                                                 <div className="flex justify-between text-sm mb-1">
                                                     <div className="truncate w-3/4 pr-2">
                                                        <span className="text-zinc-300 block font-bold truncate">{l.title}</span>
                                                        <span className="text-[10px] text-zinc-500">{l.owner}</span>
                                                     </div>
                                                     <span className="text-white font-mono text-xs">{p}%</span>
                                                 </div>
                                                 <div className="w-full bg-zinc-800 h-1.5 rounded-full overflow-hidden">
                                                     <div className="bg-gradient-fire h-full transition-all duration-500" style={{width: `${p}%`}}></div>
                                                 </div>
                                                 <div className="flex justify-between mt-1 text-[10px] text-zinc-500">
                                                     <span>{l.floor}</span>
                                                     <span>Por: {l.createdBy}</span>
                                                 </div>
                                                 
                                                 <button 
                                                     onClick={(e) => { e.stopPropagation(); onDeleteList(l.id); }} 
                                                     className="absolute top-2 right-2 p-2 text-zinc-600 hover:text-red-500 bg-zinc-900/80 rounded-full"
                                                 >
                                                     <Icons.Trash className="w-4 h-4"/>
                                                 </button>
                                             </div>
                                         )
                                    })}
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        // --- MODAL PARA NUEVA LISTA ---
        const NewListModal = ({ isOpen, onClose, onCreate, currentUser }) => {
            const [title, setTitle] = useState(''); 
            const [owner, setOwner] = useState(''); 
            const [floor, setFloor] = useState('');
            const [useTemplate, setUseTemplate] = useState(true);

            if (!isOpen) return null;

            const handleSubmit = (e) => {
                e.preventDefault();
                if (title && owner && floor) { // Validar floor requerido
                    onCreate({ title, owner, floor, useTemplate });
                    setTitle(''); setOwner(''); setFloor(''); setUseTemplate(true);
                    onClose();
                }
            };

            return (
                <div className="fixed inset-0 bg-black/90 backdrop-blur-sm flex items-center justify-center z-50 p-4 new-list-modal">
                    <div className="bg-zinc-900 border border-zinc-800 p-6 rounded-2xl w-full max-w-sm shadow-2xl">
                        <h3 className="text-xl font-bold text-white mb-6">Nueva Inspección</h3>
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label className="block text-xs font-bold text-zinc-500 uppercase mb-2">Nombre de PC / Equipo</label>
                                <input autoFocus required className="w-full bg-black border border-zinc-700 rounded-lg p-3 text-white focus:border-fire-500 outline-none transition-colors" placeholder="Ej: PC-RECEPCION-01" value={title} onChange={e => setTitle(e.target.value)} />
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-zinc-500 uppercase mb-2">Usuario (Cliente)</label>
                                <input required className="w-full bg-black border border-zinc-700 rounded-lg p-3 text-white focus:border-fire-500 outline-none transition-colors" placeholder="Nombre del usuario" value={owner} onChange={e => setOwner(e.target.value)} />
                            </div>
                            <div>
                                <label className="block text-xs font-bold text-zinc-500 uppercase mb-2">Ubicación / Piso (Requerido)</label>
                                <input required className="w-full bg-black border border-zinc-700 rounded-lg p-3 text-white focus:border-fire-500 outline-none transition-colors" placeholder="Ej: Piso 4" value={floor} onChange={e => setFloor(e.target.value)} />
                            </div>
                            <div className="flex items-center gap-3 pt-2 bg-zinc-950 p-3 rounded-lg border border-zinc-800">
                                <input type="checkbox" id="tpl" className="fire-checkbox" checked={useTemplate} onChange={e => setUseTemplate(e.target.checked)} />
                                <label htmlFor="tpl" className="text-sm text-zinc-300">Usar plantilla de Soporte</label>
                            </div>
                            <div className="flex gap-3 mt-6">
                                <button type="button" onClick={onClose} className="flex-1 bg-zinc-800 text-white py-3 rounded-xl font-medium transition-colors">Cancelar</button>
                                <button type="submit" className="flex-1 bg-gradient-fire text-white py-3 rounded-xl font-bold transition-transform active:scale-95">Crear</button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        };

        // --- APP PRINCIPAL ---
        function App() {
            const [user, setUser] = useState(() => {
                const saved = localStorage.getItem('checkmate_user_final');
                return saved ? JSON.parse(saved) : null;
            });
            const [lists, setLists] = useState([]);
            const [isCloudActive, setIsCloudActive] = useState(false);
            const [currentView, setCurrentView] = useState('lists'); 
            const [sidebarOpen, setSidebarOpen] = useState(false);
            const [isCreating, setIsCreating] = useState(false);
            const [activeListId, setActiveListId] = useState(null);
            
            const saveTimeoutRef = useRef(null);

            useEffect(() => {
                let unsub = () => {};
                const savedData = localStorage.getItem('checkmate_db_v10');
                if (savedData) setLists(JSON.parse(savedData));

                if (FIREBASE_CONFIG.apiKey && typeof firebase !== 'undefined') {
                    firebase.auth().onAuthStateChanged(async (u) => {
                        if (!u) try { await firebase.auth().signInAnonymously(); } catch(e){}
                        unsub = firebase.firestore().collection('checkmate_lists').doc(CHECKLIST_ROOM_ID)
                            .onSnapshot(doc => {
                                if (doc.exists && doc.data().data) {
                                    setLists(doc.data().data);
                                    setIsCloudActive(true);
                                }
                            });
                    });
                }
                return () => unsub();
            }, []);

            const saveData = (newLists) => {
                setLists(newLists);
                localStorage.setItem('checkmate_db_v10', JSON.stringify(newLists));
                if (saveTimeoutRef.current) clearTimeout(saveTimeoutRef.current);
                saveTimeoutRef.current = setTimeout(() => {
                    if (db) db.collection('checkmate_lists').doc(CHECKLIST_ROOM_ID).set({ data: newLists }).catch(console.error);
                }, 1000);
            };

            const TEMPLATE_ITEMS = [
                "Arranque Sin Problemas", "Usuario En Dominio", "Impresora", "Office / Word", "GLPI",
                "Antivirus", "WAVE", "Conectividad Red / IP", "Software operativos", "Funcionamiento del Disco"
            ];

            const handleCreateList = ({ title, owner, floor, useTemplate }) => {
                const initialItems = useTemplate 
                    ? TEMPLATE_ITEMS.map(text => ({ id: generateId(), text, done: false }))
                    : [];

                const newList = {
                    id: generateId(),
                    title, // PC Name
                    owner, // Usuario
                    floor,
                    createdBy: user.name,
                    status: 'active', 
                    observations: '',
                    items: initialItems
                };

                const updatedLists = [...lists, newList];
                saveData(updatedLists);
                setIsCreating(false);
                setActiveListId(newList.id);
            };

            const handleUpdateList = (updatedList) => {
                const newLists = lists.map(l => l.id === updatedList.id ? updatedList : l);
                saveData(newLists);
            };

            const handleDeleteList = (id) => {
                if(confirm("¿Borrar esta lista permanentemente?")) {
                    saveData(lists.filter(l => l.id !== id));
                }
            };

            const handleLogin = (u) => {
                setUser(u);
                localStorage.setItem('checkmate_user_final', JSON.stringify(u));
            };

            const handleFinishList = (shouldArchive) => {
                if (shouldArchive && activeListId) {
                    const newLists = lists.map(l => l.id === activeListId ? { ...l, status: 'completed' } : l);
                    saveData(newLists);
                    setActiveListId(null);
                    setCurrentView('stats'); 
                } else {
                    setActiveListId(null); 
                }
            };

            const openListFromStats = (id) => {
                setActiveListId(id);
            };

            if (!user) return <LoginScreen onLogin={handleLogin} />;

            if (activeListId) {
                const activeList = lists.find(l => l.id === activeListId);
                if (activeList) {
                    return (
                        <FocusListEditor 
                            list={activeList} 
                            onSave={handleUpdateList} 
                            onClose={() => handleFinishList(false)}
                            onFinish={handleFinishList} 
                        />
                    );
                } else {
                    setActiveListId(null);
                }
            }

            const activeLists = lists.filter(l => l.status !== 'completed' && (user.isAdmin || l.createdBy === user.name));
            
            const groupedActiveLists = activeLists.reduce((groups, list) => {
                const key = list.floor ? list.floor.toUpperCase() : 'SIN UBICACIÓN';
                if (!groups[key]) groups[key] = [];
                groups[key].push(list);
                return groups;
            }, {});

            return (
                <div className="flex h-full bg-black text-zinc-200 overflow-hidden font-sans selection:bg-fire-500 selection:text-white">
                    {/* Modal Crear Lista */}
                    {isCreating && (
                        <NewListModal isOpen={true} onClose={() => setIsCreating(false)} onCreate={handleCreateList} currentUser={user} />
                    )}

                    {/* Sidebar Desktop / Menú Móvil */}
                    <aside className={`fixed inset-y-0 left-0 w-72 bg-zinc-950 border-r border-zinc-900 z-30 transition-transform duration-300 md:relative md:translate-x-0 ${sidebarOpen ? 'translate-x-0' : '-translate-x-full'} pt-safe pb-safe`}>
                        <div className="p-6 flex items-center justify-between">
                            <h1 className="font-bold text-xl text-white">Check<span className="text-fire-500">Mate</span></h1>
                            <button onClick={() => setSidebarOpen(false)} className="md:hidden text-zinc-500 p-2"><Icons.Plus className="rotate-45"/></button>
                        </div>
                        <div className="px-6 pb-4">
                            <p className="text-xs font-bold text-zinc-500 uppercase">Técnico</p>
                            <p className="text-white truncate">{user.name}</p>
                        </div>
                        <nav className="p-4 space-y-2">
                            <button onClick={() => { setCurrentView('lists'); setSidebarOpen(false); }} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-colors ${currentView === 'lists' ? 'bg-zinc-900 text-fire-500' : 'text-zinc-400 hover:text-white'}`}>
                                <Icons.Menu /> Mis Listas
                            </button>
                            <button onClick={() => { setCurrentView('stats'); setSidebarOpen(false); }} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-colors ${currentView === 'stats' ? 'bg-zinc-900 text-fire-500' : 'text-zinc-400 hover:text-white'}`}>
                                <Icons.Chart /> Estadísticas
                            </button>
                            <button onClick={() => { setUser(null); localStorage.removeItem('checkmate_user_final'); }} className="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-zinc-500 hover:text-red-500 mt-8">
                                <Icons.Logout /> Salir
                            </button>
                        </nav>
                    </aside>
                    
                    {sidebarOpen && <div className="fixed inset-0 bg-black/80 z-20 md:hidden backdrop-blur-sm" onClick={() => setSidebarOpen(false)}></div>}

                    <main className="flex-1 flex flex-col relative bg-zinc-950 h-full overflow-hidden pt-safe">
                        {/* Header */}
                        <header className="h-16 border-b border-zinc-900 flex items-center justify-between px-4 shrink-0">
                            <button onClick={() => setSidebarOpen(true)} className="md:hidden text-zinc-400 p-2"><Icons.Menu /></button>
                            <div className="text-xs text-zinc-500 flex items-center gap-1">
                                {isCloudActive ? <span className="w-2 h-2 bg-emerald-500 rounded-full"></span> : <span className="w-2 h-2 bg-orange-500 rounded-full"></span>}
                                {isCloudActive ? 'Sync' : 'Local'}
                            </div>
                        </header>

                        {/* Content */}
                        <div className="flex-1 overflow-y-auto p-4 md:p-8 safe-padding">
                            {currentView === 'stats' ? (
                                <StatsView 
                                    lists={lists} 
                                    onOpenList={openListFromStats} 
                                    onDeleteList={handleDeleteList}
                                    currentUser={user}
                                />
                            ) : (
                                <div className="space-y-6 pb-24">
                                    {activeLists.length === 0 && (
                                        <div className="text-center py-10 text-zinc-500">
                                            <p>No tienes listas pendientes.</p>
                                            <p className="text-sm">Toca el botón + para empezar.</p>
                                        </div>
                                    )}

                                    {/* Agrupación por Pisos */}
                                    {Object.keys(groupedActiveLists).sort().map(floorName => (
                                        <div key={floorName} className="mb-6">
                                            <h4 className="text-fire-500 text-xs font-bold uppercase mb-3 pl-1 flex items-center gap-2 border-b border-zinc-800 pb-2">
                                                <Icons.Building className="w-4 h-4"/> {floorName} <span className="bg-zinc-800 text-zinc-400 px-1.5 rounded-full text-[10px]">{groupedActiveLists[floorName].length}</span>
                                            </h4>
                                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                                {groupedActiveLists[floorName].map(list => {
                                                    const total = list.items.length;
                                                    const done = list.items.filter(i => i.done).length;
                                                    const pct = total > 0 ? Math.round((done/total)*100) : 0;
                                                    
                                                    return (
                                                        <div key={list.id} onClick={() => setActiveListId(list.id)} className="bg-zinc-900 border border-zinc-800 rounded-xl p-4 active:scale-[0.98] transition-transform cursor-pointer hover:border-fire-500/30">
                                                            <div className="flex justify-between items-start mb-2">
                                                                <div className="overflow-hidden mr-2">
                                                                    <h3 className="font-bold text-white truncate text-base">{list.title}</h3>
                                                                    <p className="text-xs text-zinc-400 truncate">{list.owner}</p>
                                                                </div>
                                                                <span className={`text-xs font-bold px-2 py-1 rounded ${pct === 100 ? 'bg-emerald-900/30 text-emerald-500' : 'bg-zinc-800 text-zinc-400'}`}>{pct}%</span>
                                                            </div>
                                                            <div className="w-full bg-zinc-800 h-1.5 rounded-full overflow-hidden">
                                                                <div className="bg-gradient-fire h-full transition-all duration-500" style={{width: `${pct}%`}}></div>
                                                            </div>
                                                            <div className="flex justify-between mt-3 text-xs text-zinc-500">
                                                                <span>{list.items.length} ítems</span>
                                                                <button onClick={(e) => { e.stopPropagation(); handleDeleteList(list.id); }} className="hover:text-red-500 p-2 -m-2"><Icons.Trash /></button>
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>

                        {/* FAB */}
                        {currentView === 'lists' && (
                            <button onClick={() => setIsCreating(true)} className="absolute bottom-6 right-6 w-14 h-14 bg-gradient-fire rounded-full shadow-xl shadow-fire-900/40 flex items-center justify-center text-white z-40 fab-btn active:scale-90 transition-transform mb-safe mr-safe">
                                <Icons.Plus />
                            </button>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
