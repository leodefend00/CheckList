<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CheckMate - Fire Edition</title>
    
    <!-- Librerías Core -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    
    <!-- Configuración Tailwind (Tema Fuego) -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        // Fondo oscuro profundo
                        zinc: { 850: '#1f1f22', 900: '#18181b', 950: '#0c0c0e' }, 
                        // Colores Fuego
                        fire: { 
                            400: '#fb923c', // Naranja claro
                            500: '#f97316', // Naranja
                            600: '#ea580c', // Naranja oscuro
                            700: '#c2410c', // Rojo anaranjado
                            800: '#9a3412', // Rojo oscuro
                        }
                    },
                    screens: { 'print': {'raw': 'print'} }
                }
            }
        }
    </script>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background-color: #000; 
            color: #fff;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Scrollbar estilo fuego */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0c0c0e; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #f97316; }

        /* Checkbox Fuego */
        .fire-checkbox {
            appearance: none;
            width: 1.3em;
            height: 1.3em;
            border: 2px solid #52525b;
            border-radius: 0.25em;
            display: grid;
            place-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .fire-checkbox:checked {
            border-color: #f97316;
            background-color: #f97316;
        }
        .fire-checkbox::before {
            content: "✓";
            color: white;
            font-size: 0.9em;
            font-weight: bold;
            transform: scale(0);
            transition: transform 0.2s;
        }
        .fire-checkbox:checked::before { transform: scale(1); }

        /* Gradiente de Fuego */
        .bg-gradient-fire {
            background: linear-gradient(135deg, #f97316 0%, #dc2626 100%);
        }
        .text-gradient-fire {
            background: linear-gradient(135deg, #fb923c 0%, #ef4444 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* --- IMPRESIÓN --- */
        @media print {
            @page { size: portrait; margin: 1cm; }
            body { background-color: white !important; color: black !important; }
            .no-print, aside, button, .add-form, .fab-btn, .mobile-header { display: none !important; }
            main { margin: 0 !important; width: 100% !important; padding: 0 !important; }
            .card { border: 1px solid #000 !important; break-inside: avoid; margin-bottom: 20px; box-shadow: none !important; background: white !important; }
            .card-header { border-bottom: 1px solid #000 !important; background: #eee !important; color: black !important; }
            .checkbox-label { color: black !important; text-decoration-color: #555 !important; }
            .fire-checkbox { border-color: #000 !important; }
            .fire-checkbox:checked { background-color: #000 !important; }
            .progress-bg { background-color: #ddd !important; }
            .progress-fill { background-color: #000 !important; }
        }
    </style>
</head>
<body class="h-screen overflow-hidden">
    <div id="root" class="h-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // ID Global
        const CHECKLIST_ROOM_ID = "checkmate-global-v1";

        // CONFIGURACIÓN FIREBASE (Pega tus datos aquí si quieres nube, sino funciona local)
        const FIREBASE_CONFIG = {
            apiKey: "AIzaSyAUiRqoUjkVQdfpN2IVGUAHjd8SIWi8J6Q",
            authDomain: "cronogramastack.firebaseapp.com",
            projectId: "cronogramastack",
            storageBucket: "cronogramastack.firebasestorage.app",
            messagingSenderId: "1077254109806",
            appId: "1:1077254109806:web:ca59b3a41aa22aacb2447f"
        };

        let db = null;
        let auth = null;
        let isFirebaseAvailable = false;

        try {
            if (FIREBASE_CONFIG.apiKey && typeof firebase !== 'undefined') {
                if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
                db = firebase.firestore();
                auth = firebase.auth();
                isFirebaseAvailable = true;
            }
        } catch (e) { console.log("Modo Offline Activo"); }

        // Iconos simplificados y CORREGIDOS
        const Icons = {
            Plus: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M12 4v16m8-8H4"/></svg>,
            Trash: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>,
            Edit: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/></svg>,
            Menu: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>,
            Cloud: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z"/></svg>,
            Printer: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/></svg>, // Renombrado a Printer
            Check: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="3" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7"/></svg>
        };

        const generateId = () => Math.random().toString(36).substr(2, 9);

        function App() {
            const [lists, setLists] = useState([]);
            const [isCloudActive, setIsCloudActive] = useState(false);
            const [sidebarOpen, setSidebarOpen] = useState(false);
            
            // Estado para edición
            const [editingListId, setEditingListId] = useState(null);
            const [editingItemId, setEditingItemId] = useState(null);
            const [editValue, setEditValue] = useState('');

            // Sync Logic
            useEffect(() => {
                let unsub = () => {};
                let authUnsub = () => {};

                const initSync = async () => {
                    // Cargar local primero
                    const saved = localStorage.getItem('checkmate_fire_data');
                    if (saved) setLists(JSON.parse(saved));

                    if (isFirebaseAvailable && db && auth) {
                        authUnsub = auth.onAuthStateChanged(async (user) => {
                            if (!user) {
                                try { await auth.signInAnonymously(); } catch(e) { return; }
                            }
                            
                            unsub = db.collection('checkmate_lists').doc(CHECKLIST_ROOM_ID)
                                .onSnapshot(doc => {
                                    if (doc.exists && doc.data().data) {
                                        setLists(doc.data().data);
                                        setIsCloudActive(true);
                                    } else if (!doc.exists) {
                                        // Datos iniciales
                                        const initialData = [{ id: '1', title: '🚀 Cosas por hacer', items: [{id: 'i1', text: 'Tocar el lápiz para editar', done: false}] }];
                                        db.collection('checkmate_lists').doc(CHECKLIST_ROOM_ID).set({ data: initialData });
                                    }
                                }, err => setIsCloudActive(false));
                        });
                    }
                };
                initSync();
                return () => { unsub(); authUnsub(); };
            }, []);

            const saveData = (newLists) => {
                setLists(newLists);
                localStorage.setItem('checkmate_fire_data', JSON.stringify(newLists));
                if (isCloudActive && db) {
                    db.collection('checkmate_lists').doc(CHECKLIST_ROOM_ID).set({ data: newLists }).catch(console.error);
                }
            };

            // --- ACCIONES DE LISTA ---
            const addList = () => {
                const title = prompt("Nombre de la nueva lista:");
                if (title) saveData([...lists, { id: generateId(), title, items: [] }]);
                setSidebarOpen(false); // Cerrar menú en móvil
            };

            const deleteList = (id) => {
                if (confirm("¿Eliminar esta lista?")) saveData(lists.filter(l => l.id !== id));
            };

            const startEditList = (list) => {
                setEditingListId(list.id);
                setEditValue(list.title);
            };

            const saveEditList = (id) => {
                if (editValue.trim()) {
                    saveData(lists.map(l => l.id === id ? { ...l, title: editValue } : l));
                }
                setEditingListId(null);
            };

            // --- ACCIONES DE ITEMS ---
            const addItem = (listId, text) => {
                if (!text.trim()) return;
                const newLists = lists.map(l => {
                    if (l.id === listId) return { ...l, items: [...l.items, { id: generateId(), text, done: false }] };
                    return l;
                });
                saveData(newLists);
            };

            const toggleItem = (listId, itemId) => {
                const newLists = lists.map(l => {
                    if (l.id === listId) {
                        return { ...l, items: l.items.map(i => i.id === itemId ? { ...i, done: !i.done } : i) };
                    }
                    return l;
                });
                saveData(newLists);
            };

            const deleteItem = (listId, itemId) => {
                const newLists = lists.map(l => {
                    if (l.id === listId) return { ...l, items: l.items.filter(i => i.id !== itemId) };
                    return l;
                });
                saveData(newLists);
            };

            const startEditItem = (item) => {
                setEditingItemId(item.id);
                setEditValue(item.text);
            };

            const saveEditItem = (listId, itemId) => {
                if (editValue.trim()) {
                    const newLists = lists.map(l => {
                        if (l.id === listId) {
                            return { ...l, items: l.items.map(i => i.id === itemId ? { ...i, text: editValue } : i) };
                        }
                        return l;
                    });
                    saveData(newLists);
                }
                setEditingItemId(null);
            };

            return (
                <div className="flex h-full bg-black text-zinc-200 overflow-hidden font-sans selection:bg-fire-500 selection:text-white">
                    {/* Sidebar / Menú Móvil */}
                    <aside className={`fixed inset-y-0 left-0 w-72 bg-zinc-950 border-r border-zinc-900 z-30 transition-transform duration-300 md:relative md:translate-x-0 ${sidebarOpen ? 'translate-x-0' : '-translate-x-full'}`}>
                        <div className="p-6 flex items-center justify-between">
                            <div className="flex items-center gap-2">
                                <div className="w-8 h-8 rounded-lg bg-gradient-fire flex items-center justify-center text-white shadow-lg shadow-fire-500/20">
                                    <Icons.Check />
                                </div>
                                <h1 className="font-bold text-xl tracking-tight text-white">Check<span className="text-fire-500">Mate</span></h1>
                            </div>
                            <button onClick={() => setSidebarOpen(false)} className="md:hidden text-zinc-500"><Icons.Plus className="rotate-45" /></button>
                        </div>
                        
                        <div className="p-4 flex flex-col h-[calc(100%-80px)]">
                            <div className="flex-1 overflow-y-auto space-y-2">
                                <div className="text-xs font-bold text-zinc-500 uppercase tracking-widest mb-3 pl-2">Mis Listas</div>
                                {lists.map(l => (
                                    <div key={l.id} className="flex items-center justify-between px-3 py-3 rounded-xl bg-zinc-900/50 border border-zinc-900 hover:border-fire-600/50 hover:bg-zinc-900 transition-all cursor-pointer group">
                                        <span className="truncate text-sm font-medium">{l.title}</span>
                                        <div className="flex items-center gap-2">
                                            <span className="text-xs text-zinc-500 font-mono">{l.items.filter(i=>i.done).length}/{l.items.length}</span>
                                        </div>
                                    </div>
                                ))}
                            </div>
                            <button onClick={addList} className="mt-4 w-full bg-gradient-fire text-white font-bold py-3 px-4 rounded-xl shadow-lg shadow-fire-900/20 hover:shadow-fire-500/40 hover:scale-[1.02] transition-all active:scale-95 flex items-center justify-center gap-2">
                                <Icons.Plus /> Nueva Lista
                            </button>
                        </div>
                    </aside>
                    
                    {/* Overlay Móvil */}
                    {sidebarOpen && <div className="fixed inset-0 bg-black/80 z-20 md:hidden backdrop-blur-sm" onClick={() => setSidebarOpen(false)}></div>}

                    {/* Main Content */}
                    <main className="flex-1 flex flex-col h-full relative bg-zinc-950">
                        {/* Header Móvil y Desktop */}
                        <header className="h-16 border-b border-zinc-900 bg-zinc-950/80 backdrop-blur-md flex items-center justify-between px-4 md:px-8 z-10 sticky top-0 no-print">
                            <div className="flex items-center gap-3">
                                <button onClick={() => setSidebarOpen(true)} className="md:hidden text-zinc-400 hover:text-white mobile-header"><Icons.Menu /></button>
                                <div className={`flex items-center gap-2 text-xs px-2 py-1 rounded-full ${isCloudActive ? 'text-emerald-500 bg-emerald-500/10' : 'text-zinc-500 bg-zinc-800'}`}>
                                    <Icons.Cloud /> {isCloudActive ? 'Online' : 'Local'}
                                </div>
                            </div>
                            <button onClick={() => window.print()} className="flex items-center gap-2 text-zinc-500 hover:text-zinc-900 dark:hover:text-white transition-colors bg-zinc-900 px-3 py-1.5 rounded-lg border border-zinc-800">
                                <Icons.Printer /> Imprimir
                            </button>
                        </header>

                        <div className="flex-1 overflow-y-auto p-4 md:p-8">
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 pb-20">
                                {lists.map(list => {
                                    const total = list.items.length;
                                    const checked = list.items.filter(i => i.done).length;
                                    const percent = total === 0 ? 0 : Math.round((checked / total) * 100);

                                    return (
                                        <div key={list.id} className="bg-zinc-900 border border-zinc-800 rounded-2xl overflow-hidden flex flex-col card shadow-xl shadow-black/50 group hover:border-zinc-700 transition-colors">
                                            {/* Header de Tarjeta */}
                                            <div className="p-4 bg-zinc-900 card-header relative">
                                                <div className="flex justify-between items-start mb-3">
                                                    {editingListId === list.id ? (
                                                        <input 
                                                            autoFocus
                                                            className="bg-black text-white text-lg font-bold border-b border-fire-500 w-full outline-none"
                                                            value={editValue}
                                                            onChange={(e) => setEditValue(e.target.value)}
                                                            onBlur={() => saveEditList(list.id)}
                                                            onKeyDown={(e) => e.key === 'Enter' && saveEditList(list.id)}
                                                        />
                                                    ) : (
                                                        <h3 className="text-lg font-bold text-white truncate pr-6 cursor-pointer hover:text-fire-400 transition-colors" onClick={() => startEditList(list)}>
                                                            {list.title}
                                                        </h3>
                                                    )}
                                                    <div className="flex gap-2 absolute right-3 top-4">
                                                        <button onClick={() => startEditList(list)} className="text-zinc-600 hover:text-fire-500 no-print"><Icons.Edit /></button>
                                                        <button onClick={() => deleteList(list.id)} className="text-zinc-600 hover:text-red-500 no-print"><Icons.Trash /></button>
                                                    </div>
                                                </div>
                                                
                                                {/* Barra Progreso */}
                                                <div className="w-full bg-zinc-800 h-1.5 rounded-full overflow-hidden progress-bg">
                                                    <div className="bg-gradient-fire h-full transition-all duration-500 progress-fill" style={{width: `${percent}%`}}></div>
                                                </div>
                                                <div className="text-[10px] text-zinc-500 mt-1 text-right font-mono">{percent}% Completado</div>
                                            </div>

                                            {/* Items */}
                                            <div className="flex-1 p-4 max-h-[350px] overflow-y-auto">
                                                <ul className="space-y-3">
                                                    {list.items.map(item => (
                                                        <li key={item.id} className="flex items-start gap-3 group/item">
                                                            <input 
                                                                type="checkbox" 
                                                                className="fire-checkbox flex-shrink-0 mt-0.5"
                                                                checked={item.done}
                                                                onChange={() => toggleItem(list.id, item.id)}
                                                            />
                                                            
                                                            {editingItemId === item.id ? (
                                                                <input 
                                                                    autoFocus
                                                                    className="bg-transparent border-b border-fire-500 text-sm text-white w-full outline-none"
                                                                    value={editValue}
                                                                    onChange={(e) => setEditValue(e.target.value)}
                                                                    onBlur={() => saveEditItem(list.id, item.id)}
                                                                    onKeyDown={(e) => e.key === 'Enter' && saveEditItem(list.id, item.id)}
                                                                />
                                                            ) : (
                                                                <span 
                                                                    className={`text-sm flex-1 break-words cursor-pointer checkbox-label transition-colors ${item.done ? 'text-zinc-500 line-through decoration-zinc-600' : 'text-zinc-300 hover:text-white'}`}
                                                                    onClick={() => startEditItem(item)}
                                                                >
                                                                    {item.text}
                                                                </span>
                                                            )}
                                                            
                                                            <button onClick={() => deleteItem(list.id, item.id)} className="text-zinc-700 hover:text-red-500 opacity-0 group-hover/item:opacity-100 transition-opacity no-print">
                                                                <Icons.Trash />
                                                            </button>
                                                        </li>
                                                    ))}
                                                </ul>
                                            </div>

                                            {/* Input Add */}
                                            <div className="p-3 bg-zinc-900 border-t border-zinc-800 add-form">
                                                <input 
                                                    type="text" 
                                                    className="w-full bg-black border border-zinc-800 rounded-lg px-3 py-2 text-sm text-white placeholder-zinc-600 focus:outline-none focus:border-fire-600 transition-colors"
                                                    placeholder="+ Agregar ítem..."
                                                    onKeyPress={(e) => {
                                                        if(e.key === 'Enter') {
                                                            addItem(list.id, e.target.value);
                                                            e.target.value = '';
                                                        }
                                                    }}
                                                />
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>

                        {/* FAB Móvil (Botón flotante) */}
                        <button onClick={addList} className="md:hidden fixed bottom-6 right-6 w-14 h-14 bg-gradient-fire rounded-full shadow-xl shadow-fire-900/40 flex items-center justify-center text-white z-40 fab-btn active:scale-90 transition-transform">
                            <Icons.Plus />
                        </button>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
